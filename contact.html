<!DOCTYPE html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kontakt Oss – Sun G Holding</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      .send-btn {
        margin-top: 4px;
        padding: 11px 28px;
        background: var(--accent);
        color: var(--dark);
        border: none;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        font-family: inherit;
        transition: background 0.2s, opacity 0.2s;
        align-self: flex-start;
      }
      .send-btn:hover { background: var(--accent-hover); }
      .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

      .form-status {
        font-size: 14px;
        padding: 10px 14px;
        border-radius: 6px;
        display: none;
      }
      .form-status.success {
        display: block;
        background: rgba(60, 180, 100, 0.15);
        border: 1px solid rgba(60, 180, 100, 0.4);
        color: #6ee79a;
      }
      .form-status.error {
        display: block;
        background: rgba(220, 60, 60, 0.15);
        border: 1px solid rgba(220, 60, 60, 0.4);
        color: #f08080;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header">
        <div class="leftInfo">
          <img src="bilder/sun_G_HoldingLogo.png" alt="Sun G Holding" id="logo" />
        </div>
        <nav class="rightInfo">
          <a href="index.html" class="linkinfo">Årvollskogen 91</a>
          <a href="årvollskogen 95.html" class="linkinfo">Årvollskogen 95</a>
          <a href="coates.html" class="linkinfo">Coates kvartalet parkering</a>
          <a href="osloveien.html" class="linkinfo">Osloveien 366</a>
          <a href="solaneindom.html" class="linkinfo">Solan Eiendom</a>
          <a href="nyeprosjekter.html" class="linkinfo">Nye prosjekter</a>
          <button class="linkinfo" id="contact" onclick="window.location.href='contact.html'">Kontakt Oss</button>
        </nav>
      </div>
    </header>
    <main class="contact-page-main">
      <div class="contact-container">
        <div class="contact-info">
          <h2 class="contacttitle">Kontakt Oss</h2>
          <p class="contact-details">
            Kontakt oss for å høre mer om Sun G Holding og våre planer for framtiden!
            <br /><br />
            <a href="mailto:post@testmail.no">post@testmail.no</a>
            <br />
            <a href="tel:+4712345678">+47 123 45 678</a>
          </p>
        </div>
        <form class="contact-form" id="contactForm">
          <h3>Navn (påkrevd)</h3>
          <div class="contact-name">
            <div>
              <label for="fname">Fornavn</label>
              <input type="text" id="fname" name="fornavn" placeholder="Fornavn" required />
            </div>
            <div>
              <label for="enavn">Etternavn</label>
              <input type="text" id="enavn" name="etternavn" placeholder="Etternavn" required />
            </div>
          </div>
          <div class="contact-epost">
            <label for="epost">E-post</label>
            <input type="email" id="epost" name="epost" placeholder="din@epost.no" required />
          </div>
          <div class="message">
            <label for="beskjed">Beskjed</label>
            <textarea id="beskjed" name="beskjed" placeholder="Skriv din beskjed her..."></textarea>
          </div>
          <div class="form-status" id="formStatus"></div>
          <button type="submit" class="send-btn" id="sendBtn">Send melding</button>
        </form>
      </div>
    </main>
    <script>
      const form = document.getElementById("contactForm");
      const sendBtn = document.getElementById("sendBtn");
      const status = document.getElementById("formStatus");

      // ──────────────────────────────────────────────
      // Bytt ut denne URL-en med din Formspree-adresse
      // Gå til https://formspree.io, lag en konto og
      // erstatt "YOUR_FORM_ID" med din form-ID:
      const FORMSPREE_URL = "https://formspree.io/f/YOUR_FORM_ID";
      // ──────────────────────────────────────────────

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        sendBtn.disabled = true;
        sendBtn.textContent = "Sender...";
        status.className = "form-status";
        status.textContent = "";

        try {
          const res = await fetch(FORMSPREE_URL, {
            method: "POST",
            body: new FormData(form),
            headers: { Accept: "application/json" },
          });

          if (res.ok) {
            status.className = "form-status success";
            status.textContent = "Meldingen er sendt! Vi tar kontakt snart.";
            form.reset();
          } else {
            throw new Error();
          }
        } catch {
          status.className = "form-status error";
          status.textContent = "Noe gikk galt. Prøv igjen eller send e-post direkte.";
        }

        sendBtn.disabled = false;
        sendBtn.textContent = "Send melding";
      });
    </script>
  </body>
</html>

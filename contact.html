<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sun G Holding</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <div class="header">
        <div class="menu-button-div">
          <!-- <span id="menu-button" style="font-size: 30px; cursor: pointer"
            >&#9776;</span
          > -->
        </div>
        <div class="leftInfo">
          <img src="bilder/sun_G_HoldingLogo.png" alt="" id="logo" />
        </div>
        <div class="rightInfo">
          <a href="index.html" class="linkinfo">Årvollskogen 91</a>
          <a href="årvollskogen 95.html" class="linkinfo">Årvollskogen 95</a>
          <a href="coates.html" class="linkinfo">Coates kvartalet parkering</a>
          <br />
          <br />
          <a href="osloveien.html" class="linkinfo">Osloveien 366</a>
          <a href="solaneindom.html" class="linkinfo">Solan Eiendom</a>
          <a href="nyeprosjekter.html" class="linkinfo">Nye prosjekter</a>
          <!-- <a href="contact.html" id="contacthtml" class="linkinfo"
            >Kontakt Oss</a
          > -->
          <button class="linkinfo" id="contact">Kontakt Oss</button>
        </div>
      </div>
    </header>
    <main class="main">
      <div class="contact-container">
        <div class="contact-info">
          <h3 class="contacttitle">Kontakt Oss</h3>
          <p class="contact-details">
            Kontakt oss for å høre mer om Sun G Holding og våre planer <br />
            for framtiden!
            <br />
            <br />
            post@testmail.no
            <br />
            +47 123 45 678
          </p>
        </div>
        <div class="contact-form">
          <div class="title">
            <h3>Navn (påkrevd)</h3>
          </div>
          <div class="contact-name">
            <div>
              <label for="fname">Fornavn:</label>
              <input type="text" id="fname" class="input-name" />
            </div>
            <div>
              <label for="Enavn">Etternavn:</label>
              <input type="text" id="Enavn" class="input-name" />
            </div>
          </div>
          <div class="contact-epost">
            <label for="epost">Epost:</label>
            <input type="email" id="epost" class="input-epost" />
          </div>
          <div class="message">
            <label for="beskjed">Beskjed:</label>
            <textarea id="beskjed" class="input-message"></textarea>
          </div>
        </div>
          <!-- <button id="Send-button">Send</button> -->
        </div>
      </div>
    </main>
  </body>
</html>
